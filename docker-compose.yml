name: sentinelx

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: build/Dockerfile
      args: { SERVICE: api }
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: build/Dockerfile
      args: { SERVICE: collector }
    environment:
      HTTP_ADDR: ":8082"
      NATS_URL: nats://nats:4222
      SURICATA_EVE: /var/log/suricata/eve.json
      ZEEK_DIR: /zeek
      SIMULATE: "false"
    volumes:
      - suricata_logs:/var/log/suricata:ro
      - zeek_logs:/zeek:ro
    ports:
      - "8082:8082"
    depends_on:
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard-api:
    build:
      context: .
      dockerfile: build/Dockerfile
      args: { SERVICE: dashboard-api }
    environment:
      HTTP_ADDR: ":8081"
      NATS_URL: nats://nats:4222
      API_BASE_URL: http://api:8080
    ports:
      - "8081:8081"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  detector:
    build:
      context: .
      dockerfile: build/Dockerfile
      args: { SERVICE: detector }
    environment:
      HTTP_ADDR: ":8083"
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      NATS_URL: nats://nats:4222
    ports:
      - "8083:8083"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  victim:
    image: nginx:alpine

  traffic-gen:
    image: alpine:3.20
    depends_on: [victim]
    command: >
      sh -c "while true; do
        wget -qO- http://victim/ >/dev/null 2>&1;
        wget -qO- http://victim/admin >/dev/null 2>&1;
        wget -qO- --header='User-Agent: sqlmap/1.7' http://victim/login >/dev/null 2>&1;
        ping -c 1 victim >/dev/null 2>&1;
        sleep 5;
      done"

  attacker:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [victim]
    command: >
      sh -c "apk add --no-cache nmap >/dev/null 2>&1;
        while true; do
          sleep 90;
          nmap -Pn -T4 -p 1-120 victim >/dev/null 2>&1;
          sleep 5;
          i=0; while [ $$i -lt 12 ]; do
            wget -qO- --header='User-Agent: sqlmap/1.7' http://victim/admin >/dev/null 2>&1;
            i=$$((i+1));
          done;
        done"

  suricata:
    image: jasonish/suricata:7.0
    network_mode: "service:victim"
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: ["-i", "eth0", "-S", "/rules/local.rules"]
    volumes:
      - ./suricata:/rules:ro
      - suricata_logs:/var/log/suricata
    depends_on: [victim]

  asset-manager:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        SERVICE: asset-manager
        RUNTIME_PKGS: nmap # only this image gets nmap
    environment:
      HTTP_ADDR: ":8084"
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      NATS_URL: nats://nats:4222
      SCAN_TARGETS: 172.28.0.0/24
      SCAN_INTERVAL: 5m
      SCAN_TIMEOUT: 4m
    ports:
      - "8084:8084"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  zeek:
    image: zeek/zeek:7.0
    network_mode: "service:victim"
    cap_add: [NET_ADMIN, NET_RAW]
    working_dir: /logs
    command: ["zeek", "-i", "eth0", "LogAscii::use_json=T"]
    volumes:
      - zeek_logs:/logs
    depends_on: [victim]

  correlator:
    build:
      context: .
      dockerfile: build/Dockerfile
      args: { SERVICE: correlator }
    environment:
      HTTP_ADDR: ":8085"
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      NATS_URL: nats://nats:4222
      INCIDENT_IDLE_TIMEOUT: 15m
    ports:
      - "8085:8085"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  nats_data:
  suricata_logs:
  zeek_logs:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
